server:
  port: ${PORT:10000}

spring:
  datasource:
    url: jdbc:h2:file:/tmp/bouri-events-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:bouri_events_super_secret_key_2026_change_this_long_value_123456789}
    expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://bouri-events.vercel.app}
